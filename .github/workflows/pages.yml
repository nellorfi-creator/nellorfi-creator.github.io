name: Pubblica Revenge Gym su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica la cartella docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
